<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Puñado de Fortuna</title>
  <link rel="stylesheet" href="/css/game.css">
</head>
<body>

  <div class="reconnect-banner" id="reconnectBanner">RECONECTANDO...</div>

  <header class="header">
    <h1 class="title">Puñado de Fortuna</h1>
    <div class="connection-indicator">
      <span class="conn-dot" id="connDot"></span>
      <span id="connLabel">---</span>
    </div>
  </header>

  <main class="game-area">
    <div class="phase-badge" id="phaseBadge">ESPERANDO PIEZAS</div>

    <div class="tag-counter hidden" id="tagCounterContainer">
      <div class="counter-label">PIEZAS DETECTADAS</div>
      <div class="counter-value" id="tagCount">0</div>
    </div>

    <div class="color-grid hidden" id="colorGridContainer">
      <div class="grid-label">COLORES</div>
      <div class="grid" id="colorGrid"></div>
    </div>

    <div class="enter-hint" id="enterHint">PRESIONA ENTER PARA REVELAR</div>
  </main>

  <div class="shortcut-hint">F1: Reiniciar | ENTER: Avanzar</div>

  <script src="/js/signalr.min.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
